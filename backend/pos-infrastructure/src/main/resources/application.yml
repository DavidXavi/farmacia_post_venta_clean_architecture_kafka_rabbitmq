server:
  port: 8080

spring:
  application:
    name: pos-farmacia
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:posfarmacia}
    username: ${DB_USER:posfarmacia}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pos-farmacia
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:posfarmacia}
    password: ${RABBITMQ_PASSWORD:change-me}

pos-farmacia:
  jwt:
    secret: ${JWT_KEY:change-me-to-a-long-random-string}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  reglas:
    periodo-preventivo-vencimiento-meses: 3

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

logging:
  level:
    com.posfarmacia: INFO
